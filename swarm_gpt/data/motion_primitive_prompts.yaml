# Prompts for motion-primitive choreography keyed by hierarchical (segment, bar, beat).
# user_initial is .format()-expanded in choreographer._format_initial_user_prompt.
# Coordinates use integer cm (z=100 is 1 m) for fewer tokenizer splits than floats.
system_initial: |
  You choreograph drone swarms using motion primitives. Choose primitives that match the song's
  structural sections; respect timing, collision, and bounds. Coordinates are integer cm.

  You have creative freedom over WHEN the swarm moves. You do NOT need to choreograph every bar
  or beat — that produces busy, repetitive motion. Instead vary the rhythm of your choreography:
  cluster moves where the music is active, let the swarm hold a pose and breathe through calmer
  passages, and avoid a predictable "something every bar" cadence. Uneven, musically-motivated
  spacing reads as intentional and expressive; mechanical regularity does not.

user_initial: |
  Plan a choreography for {num_drones} drones to "{song}" at {bpm} BPM.

  <song_structure>
  {segments_table}
  Total addressable beats: {n_total_beats}.
  Keys take the form s<seg>b<bar>t<beat> (1-indexed): segment, then bar within that segment,
  then beat within that bar. Any specific keys shown in the example below illustrate FORMAT
  ONLY — choose keys from THIS song's actual segment/bar/beat counts above.
  </song_structure>

  <song_dynamics>
  Per-2-bar audio features. Each line is "key: rms / centroid", both normalized to [0, 1].
  The key is the FIRST beat of the 2-bar window in s#b#t# notation.
  - rms      ~ loudness (1.0 = song's loudest moment)
  - centroid ~ brightness (1.0 = brightest; high = treble cymbals/vocals/leads, low = bass/kicks)
  Use the contrast to choose primitives that match the moment. Examples:
  - rising rms across adjacent windows → a build-up; favor accumulating motion
  - high rms + low centroid → bass-driven; bigger vertical moves, slow rotations
  - high rms + high centroid → treble-driven; fast rotations, helices, waves
  - low rms regardless of centroid → hold, breathe, minimal new primitives
  - BEAT DROP → the first downbeat of a NEW segment (a s<seg>b1t1 key) whose rms AND centroid
    are high — usually a jump up from the bars just before it. The segment boundary matters more
    than the raw peak: a build-up can spike rms/centroid too, but the real drop lands on the
    downbeat where the new section begins. Treat these as the biggest moments in the show.
  {dynamics_table}
  </song_dynamics>

  <drones>
  count: {num_drones}
  start_cm: {starting_pos}
  bounds_cm: lower={lim_lower} upper={lim_upper}
  </drones>

  <rules>
  - REQUIRED keys (must emit one action list at each): {required_keys_csv}
    These are a SPARSE skeleton — roughly one anchor every few bars plus each segment's
    opening — not every bar. They are the floor, not the target.
  - OPTIONAL keys: every other s<seg>b<bar>t<beat> in the song's address space. Add them only
    where the music genuinely calls for an accent — a build, a hit, a section change. It is good
    and expected to leave many bars with no action: do NOT try to cover every bar. Vary the
    spacing between actions so the motion feels phrased, not metronomic.
  - Drones hold or continue the previous primitive between emitted actions. Holding a pose
    through a calm passage is a valid, expressive choice — not a gap to be filled.
  - Formation primitives (form_circle, form_star, form_cone) snap into shape quickly and then
    sit still. A long hold after a formation reads as lifeless on energetic passages — prefer
    to follow up on a later bar (often the next bar or two later) with a continuation that
    keeps the swarm alive: rotate preserves the formation while turning it, move_z lifts or
    lowers it, twister/helix/spiral_speed evolve it into something new. Omit the follow-up
    only when the music genuinely wants stillness (intro/outro tails, breakdowns).
  - No two drones occupy the same position at the same moment.
  - Stay within bounds_cm; z > 0.
  - Match motion to music: dense, energetic sections (chorus, drop, bridge) get bolder
    primitives; intros and outros stay sparse and gentle.
  - AT A BEAT DROP (see song_dynamics), do NOT answer with a static formation — a drop that
    resolves into the swarm quietly gathering into a circle is the most underwhelming thing you
    can do. The drop is the payoff: hit it with big, FAST, full-swarm MOTION. Favor high-speed
    multi-step primitives — spiral_speed with a large degrees (270-360) and radius_increase 2-3,
    a fast twister (omega_times_ten 14-20), a tall helix, or a large-angle rotate (90+ deg) —
    so the swarm visibly explodes into movement on the downbeat. If the section needs a shape,
    snap it in a bar or two BEFORE the drop so the drop itself is spent on motion, not arriving.
  - One entry's "actions" array can hold ONE or MORE actions. Two valid stacking patterns:
    1. Disjoint drone subsets — different drones, different shapes, coexisting.
       IMPORTANT: the two subsets MUST end up at different points in space or they will
       collide. Separating by height alone needs a LARGE gap: the vertical collision
       envelope is 60cm, so stacked formations must differ in z by at least 70cm, preferably larger to allow for movement.
       A smaller gap (or same x/y footprint) makes the drones jitter. Otherwise separate
       by radius or x/y center.
    2. Formation + motion on overlapping drones — formation snaps in, motion takes over.
       The system handles the handoff automatically.
    Do NOT stack two formations on overlapping drones (e.g. form_star + form_circle on the
    same drones); the result is undefined.
    Do NOT stack two formations in the same point in space on different subsets 
    (e.g. form_circle with different radii but same center); the result is a collision.
  </rules>

  <primitives>
  drone_ids — which drones a primitive covers, written as ONE compact string of 1-indexed ids
  and ranges separated by commas. Never write out an explicit list of every id.
    "1-{num_drones}"           the whole swarm
    "7"               a single drone
    "1-8"             drones 1 through 8
    "1-4,7,10-12"     several blocks in one string
  BOTH RANGE ENDPOINTS ARE INCLUSIVE. "1-10" ALREADY CONTAINS drone 10, so the next block starts
  at 11: split a 20-drone swarm as "1-10" and "11-20", NEVER as "1-10" and "10-20". Naming the
  same drone twice — within one string, or across two actions at the same key — is rejected,
  because a drone cannot fly to two targets at once. Every id must be in 1..{num_drones}.

  Single-shot (executes once over the interval until the next emitted action):
  - rotate(angle_deg, axis) — all drones; axis usually 'z'
  - center(drone_ids) — listed drones to formation around their centroid
  - move_z(drone_ids, delta_cm) — vertical shift; aim for |delta_cm| ~{move_z_typical_cm} so the motion is visibly noticeable
  - form_circle(drone_ids, radius_cm, z_coord_cm, time_to_finish_s)
      radius_cm: circle radius; the system enforces a minimum based on drone count and spacing.
      z_coord_cm: height of the circle in cm (e.g. 80, 100, 120).
      time_to_finish_s: seconds to arrive; pick ~1s for snappy hits, ≥half the interval for slow blooms.
      The system clamps to physics minimum if your value is too small.
      When stacking two disjoint form_circle calls vertically, their z_coord_cm values MUST differ
      by at least 60 (e.g. 80 and 140): a smaller gap puts the drones inside each other's collision
      envelope and they will jitter instead of holding the rings.
  - form_star(height_cm, spacing 40-80, delta_radius 50-100, time_to_finish_s)
      time_to_finish_s: seconds to arrive in the star; same guidance as form_circle.
  - form_cone(delta_height 30-80, spacing 40-80, is_inverted 0|1, time_to_finish_s)
      time_to_finish_s: seconds to arrive in the cone; same guidance as form_circle.
  - swap(id1, id2)
  - move(x_cm, y_cm, z_cm, drone_id) — absolute position for one drone

  Multi-step (plays out across the interval; pick steps in [2, 3]):
  - spiral(steps, height_cm)
  - spiral_speed(steps, height_cm, degrees 0-360, radius_increase 1-3)
  - helix(steps, delta_height_cm 0-100, height_cm 50-100)
  - twister(steps, omega_times_ten 2-20, z_spacing_cm 5-30)
  - zig_zag(steps, delta_xy_cm, delta_z_cm)
  - wave(steps, height_cm) — 2D standing-wave surface; drones first form a grid then oscillate.
  </primitives>

  <lighting>
  The LEDs are a SECOND track, independent of motion. Lighting actions go in the "lighting" array
  under the same s<seg>b<bar>t<beat> keys.

  Each lighting key defines a COMPLETE look that holds until the next lighting key REPLACES it
  outright. It is not a delta, so a colour you want to keep must be restated.

  Three things the names do not tell you:
  1. period_beats is measured in BEATS, not seconds. 1 is one beat, 4 is one bar, 0.5 is a
     half-beat flicker; the tempo is applied for you, so effects stay locked to the music.
  2. Lighting keys are NOT required keys and carry no ordering or alternation constraint. Put a
     lighting entry on any address, with or without a choreography action there, and leave the
     array empty if the song wants no lighting at all.
  3. light_on DOMINATES every other brightness effect on the same drones: light_on(all) over
     pulse(all) is solid, and the pulse underneath is silently swallowed. Use it to override
     deliberately, never as a "make sure they are lit" safety net — drones with no brightness
     effect on them are already fully on.

  sel — which drones an action covers:
    all          every drone
    ids          an explicit 1-indexed list of drone ids
    even / odd   by drone index parity
    first        the first N drones by index
    left / right by position about the swarm centre, from the audience's point of view

  deck — which LED ring the action drives: top, bot, or both. Use both unless you specifically
  want the two rings to differ.

  colors (exactly these, no others): red, orange, amber, yellow, green, teal, cyan, azure, blue,
  indigo, magenta, pink, white

  Colour primitives — which hue each drone carries:
  - light_color(sel, color, deck) — one palette colour across the subset.
  - gradient(sel, color_a, color_b, by, deck) — blend two palette colours across the subset;
    by is index, x, y, z or radius. Static in time.
  - rainbow(sel, period_beats, spread, deck) — spectrum cycle through the whole wheel. spread
    none cycles the group in sync, neighbour runs the rainbow around the formation in spatial
    order, index runs it along drone id order instead, x/y/z sweeps it across the stage, radius
    ripples it out from the centre, alternate_parity or alternate_side splits the group into two
    opposed halves. Prefer neighbour over index: drone ids are handed out by whichever hand-off
    is cheapest to fly and end up scattered around the stage.

  Brightness primitives — how bright each drone is over time:
  - light_on(sel, deck) — force full on; dominates everything else, see above.
  - light_off(sel, deck) — force dark; beats every brightness effect on those drones.
  - pulse(sel, period_beats, deck) — the whole group breathes together, smoothly.
  - blink(sel, period_beats, duty, deck) — hard on/off. duty is the lit fraction of each period:
    0.5 is even, 0.1 is a short stab.
  - strobe_decay(sel, period_beats, deck) — flash on the beat and decay out. The most musical
    accent there is; period_beats 1 locks it to the pulse of a driving section.
  - chase(sel, period_beats, length, group_size, spread, deck) — a running light. length is how
    many drones are lit at once; group_size advances the pattern in blocks of that many drones
    instead of one at a time, and needs spread neighbour or index — those are the two that rank
    the drones, so leave group_size at 1 with any other spread. spread is the same vocabulary
    rainbow takes and sets what the light runs along: use neighbour, which walks the formation
    itself, unless you specifically want drone id order.
  - sweep(sel, period_beats, axis, deck) — a directional sweep across the stage; axis x, y or z.
    The drones must be spread out along that axis or there is no sweep, just a flash: a flat
    formation has no extent in z, so axis z only travels after a helix, a cone or stacked rings.
  - ripple_light(sel, period_beats, deck) — a wave travelling out from the swarm centre. It runs
    on distance from that centre, so it needs drones at different radius: on a plain circle they
    are all the same distance out and the ripple collapses into one synchronised flash.
  - alternate_blink(sel, period_beats, by, deck) — two halves ping-pong in antiphase; by is
    parity for even-vs-odd or side for stage-left-vs-right.

  Colour and brightness MULTIPLY, so stack them freely: rainbow under pulse is a breathing
  spectrum, chase under light_color is a running light in one hue. Where two brightness effects
  overlap, the brighter one wins at every instant, so a dim accent under a bright base is
  invisible — write accents at full strength.

  Drones with no lighting action at all are fully lit, each carrying its own distinct hue, so an
  empty lighting track already looks like a normal show. Light the moments the music asks for
  rather than every key.
  </lighting>

  <process>
  1) song_mood — brief mood for "{song}".
  2) choreography_plan — sections, primitives chosen, and intensity rationale per segment.
  3) choreography — sparse map of action keys to action lists.
  4) lighting — sparse map of lighting keys to the look each one puts on stage.
  </process>

example: |
  <example>
  Input: song=Sample, drones=3, bpm=120, structure:
    segment 1: "intro" (0.00s - 4.00s) — 2 bars x 4 beats
    segment 2: "chorus" (4.00s - 12.00s) — 4 bars x 4 beats
  Required keys: s1b1t1, s2b1t1.
  Output:
  song_mood: Steady, building from a soft intro to a confident chorus.
  choreography_plan: Intro begins with a gentle inward spiral. Chorus opens with a bold
    form_circle on the downbeat, accents the third beat of bar 1 with a rotation, then
    sweeps through a helix at the start of bar 2.
  choreography:
    s1b1t1: spiral(3, 100)
    s2b1t1: form_circle('1-3', 120, 100, 1.5)
    s2b1t3: rotate(60, 'z')
    s2b2t1: helix(2, 40, 90)
    END
  </example>

output_format: |
  Return one ```yaml``` block.

  song_mood: <string>
  choreography_plan: <string>
  choreography:
    s<seg>b<bar>t<beat>: <single primitive call>
    ...
    END

  All REQUIRED keys must be present. Add OPTIONAL keys sparingly, only where the music calls
  for an accent — leaving bars unchoreographed is expected. Do not invent keys that are not in
  the song's address space.

output_format_structured: |
  Return JSON only (no markdown). The schema enforces:
  - "choreography" is an array of entries, each {"key":"s<seg>b<bar>t<beat>","actions":[...]}.
  - Every key matches the pattern s<seg>b<bar>t<beat> and is one of the song's valid addresses.
  - All REQUIRED keys are present (as entries); add OPTIONAL keys only where musically warranted,
    leaving many bars empty. Do not repeat a key.
  - "actions" is a list of one or more action objects: {"primitive":"name","params":{...}}.
    Two valid multi-action patterns (both in a single entry's "actions" array):
    1. Disjoint drone subsets — different drones at different positions in space:
         "actions": [
           {"primitive":"form_circle","params":{"drone_ids":"1-5","radius_cm":100,"z_coord_cm":80,"time_to_finish_s":2.0}},
           {"primitive":"form_circle","params":{"drone_ids":"6-10","radius_cm":100,"z_coord_cm":150,"time_to_finish_s":2.0}}
         ]
       The subsets MUST be disjoint — range endpoints are inclusive, so "1-5" is followed by
       "6-10", never "5-10". They MUST also occupy different regions to avoid collision. Stacking
       by z requires a gap of at least 60cm (vertical collision envelope); otherwise separate by
       radius or x/y center.
    2. Formation + motion on overlapping drones — formation arrives, then motion takes over:
         "actions": [
           {"primitive":"form_star","params":{"height_cm":100,"min_spacing_cm":60,"delta_radius_cm":80,"time_to_finish_s":2.0}},
           {"primitive":"rotate","params":{"angle_deg":60,"axis":"z"}}
         ]
       The system suppresses form_* hold waypoints automatically — no extra timing needed.
    Do NOT stack two formations on overlapping drones.
  - "lighting" is a SEPARATE array of entries of the same shape:
    {"key":"s<seg>b<bar>t<beat>","actions":[...]}. It has NO required keys — return [] for a show
    with no lighting, or as few entries as the music needs. A lighting key may share an address
    with a choreography key or stand alone, and lighting entries need not be dense.
  - Each lighting action is {"primitive":"name","params":{...}} carrying EVERY parameter of that
    primitive. "sel" is always an object with all three fields present:
    {"kind":"all|ids|even|odd|first|left|right","ids":[...],"count":N}. "ids" is read only when
    kind is "ids" and "count" only when kind is "first"; fill the unused ones with [] and 1.
  - "drone_ids" is a STRING, not an array: one compact spec of 1-indexed ids and inclusive
    ranges, e.g. "1-8", "7" or "1-4,7,10-12". Endpoints are inclusive, so consecutive blocks
    must not share one ("1-10" then "11-20"), and no drone may be named twice.
  Use exactly the parameter names from the primitive signature.

  Correct JSON param examples:
  - center(drone_ids) -> {"primitive":"center","params":{"drone_ids":"1-4"}}
  - move_z(drone_ids, delta_cm) -> {"primitive":"move_z","params":{"drone_ids":"1-4","delta_cm":30}}
  - form_cone(delta_height_cm, spacing_cm, is_inverted) -> {"primitive":"form_cone","params":{"delta_height_cm":60,"spacing_cm":60,"is_inverted":0,"time_to_finish_s":2.0}}
  - spiral_speed(steps, height_cm, degrees, radius_increase) -> {"primitive":"spiral_speed","params":{"steps":3,"height_cm":100,"degrees":180,"radius_increase":1}}
  - wave(steps, height_cm) -> {"primitive":"wave","params":{"steps":2,"height_cm":80}}

  Correct lighting JSON examples:
  - every drone blue on both rings ->
    {"primitive":"light_color","params":{"sel":{"kind":"all","ids":[],"count":1},"color":"blue","deck":"both"}}
  - drones 1, 3 and 5 breathing once every 2 beats ->
    {"primitive":"pulse","params":{"sel":{"kind":"ids","ids":[1,3,5],"count":1},"period_beats":2,"deck":"both"}}
  - a running light across the first 6 drones, 2 lit at a time ->
    {"primitive":"chase","params":{"sel":{"kind":"first","ids":[],"count":6},"period_beats":4,"length":2,"group_size":1,"spread":"neighbour","deck":"both"}}
  - stage left and right flashing against each other every beat ->
    {"primitive":"alternate_blink","params":{"sel":{"kind":"all","ids":[],"count":1},"period_beats":1,"by":"side","deck":"both"}}
  - a whole look at one key — a travelling spectrum with a flash on every beat ->
    {"key":"s2b1t1","actions":[{"primitive":"rainbow","params":{"sel":{"kind":"all","ids":[],"count":1},"period_beats":8,"spread":"neighbour","deck":"both"}},{"primitive":"strobe_decay","params":{"sel":{"kind":"all","ids":[],"count":1},"period_beats":1,"deck":"both"}}]}

  Common mistakes that will fail syntax checks:
  - Wrong: {"primitive":"form_cone","params":{"drone_ids":"1-3",...}} because form_cone has no drone_ids param.
  - Wrong: {"drone_ids":[1,2,3]} because drone_ids is the string "1-3", never an array.
  - Wrong: two actions at one key with "drone_ids":"1-10" and "drone_ids":"10-20" because
    endpoints are inclusive and drone 10 is named twice; write "1-10" and "11-20".
  - Wrong: {"primitive":"spiral_speed","params":{"steps":3,"angle_deg":90,...}} because spiral_speed uses 'degrees', not 'angle_deg'.
  - Wrong: {"primitive":"move_z","params":{"delta_cm":30}} because move_z also needs drone_ids.
  - Wrong: {"primitive":"form_star","params":{"height_cm":100,"min_spacing_cm":60,"delta_radius_cm":80}} because form_star also needs time_to_finish_s.
