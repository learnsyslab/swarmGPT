radio:
  uri_base: "radio://0/{channel}/2M/E7E7E7E7{addr:02X}"

starting_height: 1.0  # Starting height for all drones
lighthouse: false  # Whether to use lighthouse or mocap for localization
land_on_docks: true

# Choreography
choreography:
  bars_per_required: 4  # Stride (in bars) between REQUIRED downbeats the LLM must choreograph.
                        # 1 = every bar; 4 = first bar of each segment + every 4th bar after.
                        # Beats in between stay addressable as encouraged-but-optional accents.

# Per-song crop window [start_s, end_s] in seconds. Songs are analyzed in full, but only this
# window is choreographed and played back (the snippet). Times are rebased so the window starts
# at 0:00. Falls back to `default` for any song without an explicit entry.
song_crops:
  default: [0, 60]
  "Chopin - Nocturne Op. 9 No. 2": [0, 60]
  "Crazyflie Drones Theme": [0, 60]
  "Crazyflie Drones Theme (short)": [0, 60]
  "Dance of the Flying Machines": [0, 60]
  "Debussy - Clair de Lune": [0, 60]
  "J. Strauss I - Radetzky March": [0, 60]
  "J. Strauss II - The Blue Danube Op. 314": [64, 124]
  "Mozart - Eine kleine Nachtmusik": [0, 60]
  "On & On": [52, 82]
  "Vivaldi - Summer": [0, 60]
  "We Wish You a Merry Christmas": [0, 60]
  "Fearless2": [35, 70]
  "Mortals": [0, 60]

# Simulation
sim_freq: 500 # Frequency for the crazyflow simulation
attitude_freq: 500 # Frequency for the crazyflow simulation for the drone attitudes
state_freq: 50 # Frequency for the crazyflow simulation for the drone states

axswarm:
  rho_init: 1.0 # Initial value of the penalty parameter
  rho_max: 1000.0 # Maximum value of the penalty parameter
  max_iters: 1000 # Maximum number of iterations

  # Constraints
  pos_constraints: hard  # Either hard, soft or false
  vel_constraints: false
  acc_constraints: false
  input_continuity_constraints: hard
  max_collisions: 10

  # Weights
  pos_weight: 1.0  # Weight of the position tracking objective in the cost
  vel_weight: 0.0  # Weight of the velocity tracking objective in the cost
  acc_weight: 0.0  # Weight of the acceleration tracking objective in the cost
  smoothness_weight: 10.0  # Weight of the smoothness objective in the cost
  input_smoothness_weight: 10.0  # Weight of the input smoothness objective in the cost
  input_continuity_weight: 1.0  # Weight of the input continuity objective in the cost

  # Limits, sized for the lab volume. The primitives scale their formation radius as
  # min_spacing / (2 sin(pi/n)), so a 100-drone sim swarm needs roughly [-10, -10] / [10, 10, 6].
  pos_min: [-2.0, -2.0, 0.25]  # Minimum position of the AMSwarm drones
  pos_max: [2.0, 2.0, 1.7]  # Maximum position of the AMSwarm drones
  vel_max: 1.73  # Maximum velocity of the AMSwarm drones
  acc_max: 1.0  # Maximum force of the AMSwarm drones (0.75 gs)
  # Isotropic: downwash is deliberately not modelled, so drones may sit directly above each other.
  # Restore z to 0.6 before flying hardware.
  collision_envelope: [0.25, 0.25, 0.25]  # Collision envelope width in x, y, z

  # MPC
  K: 50  # Number of timesteps in the optimization horizon
  N: 10  # Spline order for AMSwarm trajectories
  freq: 10  # MPC control frequency of AMSwarm in Hz
  bf_gamma: 1.0  # Barrier function gamma [0, 1.0] -> 1.0 is most aggressive
  waypoints_pos_tol: 0.1  # Tolerance for the waypoints position constraint
  waypoints_vel_tol: 0.01  # Tolerance for the waypoints velocity constraint
  waypoints_acc_tol: 0.01  # Tolerance for the waypoints acceleration
  pos_limit_tol: 0.01  # Tolerance for the input position constraint
  vel_limit_tol: 0.01  # Tolerance for the input velocity constraint
  acc_limit_tol: 0.01  # Tolerance for the input acceleration
  input_continuity_tol: 0.01  # Tolerance for the input continuity constraint
  collision_tol: 0.01  # Tolerance for the collision avoidance constraint

